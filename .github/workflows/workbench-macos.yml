name: Plot Workbench macOS beta

on:
  push:
    branches: [workbench/v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            src-tauri
            workerd
          shared-key: workbench-macos-arm64
      - name: Install dependencies
        run: |
          test "$(uname -m)" = arm64
          python -m pip install -r requirements.txt
          python -m pip install -e '.[worker,workbench]' pyinstaller pytest
          pnpm --dir web install --frozen-lockfile
      - name: Test
        run: |
          cargo test --manifest-path workerd/Cargo.toml
          python -m pytest -q tests/test_workbench*.py
          pnpm --dir web exec vitest run src/workbench
      - name: Build unsigned beta
        run: python scripts/workbench_build.py
      - name: Check frozen dependencies
        run: python scripts/ci/retirement_scan.py --dist dist/Tavotto
      - name: Mount and exercise the delivered app
        run: |
          mkdir -p "$RUNNER_TEMP/mount" "$RUNNER_TEMP/中文 安装目录"
          hdiutil attach dist/Plot-Workbench-*-macOS-arm64.dmg -mountpoint "$RUNNER_TEMP/mount" -nobrowse -readonly
          trap 'hdiutil detach "$RUNNER_TEMP/mount"' EXIT
          ditto "$RUNNER_TEMP/mount/Plot Workbench.app" "$RUNNER_TEMP/中文 安装目录/Plot Workbench.app"
          python scripts/workbench_macos_smoke.py "$RUNNER_TEMP/中文 安装目录/Plot Workbench.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-macOS-arm64-beta
          path: |
            dist/Plot-Workbench-*-macOS-arm64.dmg
            dist/Plot-Workbench-*-macOS-arm64.dmg.sha256
          if-no-files-found: error
